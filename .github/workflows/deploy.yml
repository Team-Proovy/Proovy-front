name: Deploy Frontend (Firebase Hosting)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-deploy-${{ inputs.environment }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ inputs.environment == 'staging' || github.ref == 'refs/heads/dev' }}
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER || format('projects/{0}/locations/global/workloadIdentityPools/github-actions-pool/providers/github-oidc-provider', vars.GCP_PROJECT_NUMBER) }}
          service_account: ${{ vars.DEPLOY_SA_EMAIL || format('proovy-deploy-sa@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}

      - name: Resolve Server Cloud Run URL
        id: server_url
        env:
          CONFIGURED_SERVER_URL: ${{ vars.VITE_API_BASE_URL || vars.SERVER_URL || secrets.VITE_API_BASE_URL }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION || 'asia-northeast3' }}
        run: |
          if [ -z "${GCP_PROJECT_ID// }" ]; then
            echo "::error::GCP_PROJECT_ID is required"
            exit 1
          fi
          RESOLVED_URL="$(gcloud run services describe proovy-server-api --region="$GCP_REGION" --project="$GCP_PROJECT_ID" --format='value(status.url)')"
          RESOLVED_URL="${RESOLVED_URL%/}"
          if [ -z "$RESOLVED_URL" ]; then
            echo "::error::Failed to resolve proovy-server-api status.url for project $GCP_PROJECT_ID"
            exit 1
          fi
          if [[ ! "$RESOLVED_URL" =~ ^https://[^/]+\.run\.app$ ]]; then
            echo "::error::Resolved Server URL must be an HTTPS run.app origin, got: $RESOLVED_URL"
            exit 1
          fi
          if [ -n "${CONFIGURED_SERVER_URL// }" ]; then
            NORMALIZED_OVERRIDE="${CONFIGURED_SERVER_URL%/}"
            if [ "$NORMALIZED_OVERRIDE" != "$RESOLVED_URL" ]; then
              echo "::error::Configured Server URL ($NORMALIZED_OVERRIDE) does not match selected project Cloud Run URL ($RESOLVED_URL)"
              exit 1
            fi
          fi
          echo "SERVER_URL=$RESOLVED_URL" >> "$GITHUB_ENV"

      - name: Resolve OAuth Environment Variables
        env:
          TARGET_ENV: ${{ inputs.environment }}
          RAW_KAKAO_CLIENT_ID: ${{ vars.VITE_KAKAO_CLIENT_ID || secrets.VITE_KAKAO_CLIENT_ID }}
          RAW_KAKAO_REDIRECT_URI: ${{ vars.VITE_KAKAO_REDIRECT_URI || secrets.VITE_KAKAO_REDIRECT_URI }}
          RAW_NAVER_CLIENT_ID: ${{ vars.VITE_NAVER_CLIENT_ID || secrets.VITE_NAVER_CLIENT_ID }}
          RAW_NAVER_REDIRECT_URI: ${{ vars.VITE_NAVER_REDIRECT_URI || secrets.VITE_NAVER_REDIRECT_URI }}
        run: |
          if [ -z "${RAW_KAKAO_CLIENT_ID// }" ] || [ -z "${RAW_KAKAO_REDIRECT_URI// }" ]; then
            echo "::error::VITE_KAKAO_CLIENT_ID and VITE_KAKAO_REDIRECT_URI are required for $TARGET_ENV"
            exit 1
          fi
          {
            echo "RESOLVED_KAKAO_CLIENT_ID=$RAW_KAKAO_CLIENT_ID"
            echo "RESOLVED_KAKAO_REDIRECT_URI=$RAW_KAKAO_REDIRECT_URI"
          } >> "$GITHUB_ENV"
          if [ "$TARGET_ENV" = "staging" ]; then
            {
              echo "RESOLVED_NAVER_CLIENT_ID="
              echo "RESOLVED_NAVER_REDIRECT_URI="
            } >> "$GITHUB_ENV"
          else
            if [ -z "${RAW_NAVER_CLIENT_ID// }" ] || [ -z "${RAW_NAVER_REDIRECT_URI// }" ]; then
              echo "::error::VITE_NAVER_CLIENT_ID and VITE_NAVER_REDIRECT_URI are required for $TARGET_ENV"
              exit 1
            fi
            {
              echo "RESOLVED_NAVER_CLIENT_ID=$RAW_NAVER_CLIENT_ID"
              echo "RESOLVED_NAVER_REDIRECT_URI=$RAW_NAVER_REDIRECT_URI"
            } >> "$GITHUB_ENV"
          fi

      - name: Build
        run: pnpm run build
        env:
          NODE_ENV: production
          VITE_API_BASE_URL: ${{ env.SERVER_URL }}
          VITE_APP_BASE_URL: ${{ vars.VITE_APP_BASE_URL || secrets.VITE_APP_BASE_URL }}
          VITE_KAKAO_CLIENT_ID: ${{ env.RESOLVED_KAKAO_CLIENT_ID }}
          VITE_KAKAO_REDIRECT_URI: ${{ env.RESOLVED_KAKAO_REDIRECT_URI }}
          VITE_NAVER_CLIENT_ID: ${{ env.RESOLVED_NAVER_CLIENT_ID }}
          VITE_NAVER_REDIRECT_URI: ${{ env.RESOLVED_NAVER_REDIRECT_URI }}

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_HOSTING_SITE: ${{ vars.FIREBASE_HOSTING_SITE || secrets.FIREBASE_HOSTING_SITE }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
        run: |
          if [ -z "${GCP_PROJECT_ID// }" ]; then
            echo "::error::GCP_PROJECT_ID is required"
            exit 1
          fi
          if [ -z "${FIREBASE_HOSTING_SITE// }" ]; then
            echo "::error::FIREBASE_HOSTING_SITE is required"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("firebase.json", "utf8"));
            cfg.hosting.site = process.env.FIREBASE_HOSTING_SITE.trim();
            fs.writeFileSync("firebase.json", JSON.stringify(cfg, null, 2));
          '
          pnpm dlx firebase-tools@13 deploy --only hosting --project "${GCP_PROJECT_ID}" --non-interactive
