name: Deploy to AWS

on:
  push:
    branches:
      - dev # dev 브랜치 → 개발 서버
      - main # main 브랜치 → 프로덕션

env:
  AWS_REGION: ap-northeast-2

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # dev 브랜치 → 개발 서버 배포
      - name: Deploy to Dev
        if: github.ref == 'refs/heads/dev'
        run: |
          aws s3 sync dist/ s3://dev.proovy.ai.kr --delete
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CF_DEV_ID }} --paths "/*"
          echo "✅ Deployed to https://dev.proovy.ai.kr"

      # main 브랜치 → 프로덕션 배포
      - name: Deploy to Production
        if: github.ref == 'refs/heads/main'
        run: |
          aws s3 sync dist/ s3://proovy.ai.kr --delete
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CF_PROD_ID }} --paths "/*"
          echo "✅ Deployed to https://proovy.ai.kr"
